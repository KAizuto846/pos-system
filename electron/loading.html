<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POS System - Iniciando...</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', Arial, sans-serif;
         display: flex; align-items: center; justify-content: center; height: 100vh; }
  .box { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 40px;
         max-width: 520px; width: 90%; text-align: center; }
  h1 { font-size: 24px; margin-bottom: 8px; }
  .spinner { width: 40px; height: 40px; border: 3px solid #334155; border-top-color: #22c55e;
             border-radius: 50%; animation: spin 0.8s linear infinite; margin: 20px auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #log { background: #0f172a; border-radius: 8px; padding: 12px; margin-top: 16px;
         text-align: left; font-size: 12px; font-family: 'Consolas', monospace;
         max-height: 150px; overflow-y: auto; color: #94a3b8; }
  .ok { color: #22c55e; } .err { color: #ef4444; } .warn { color: #f59e0b; }
  .retry-btn { display: none; margin-top: 16px; padding: 10px 24px; background: #10b981;
               color: white; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
  .retry-btn:hover { background: #059669; }
  .retry-btn.show { display: inline-block; }
</style>
</head>
<body>
<div class="box">
  <h1>POS System</h1>
  <p>Iniciando servidor...</p>
  <div class="spinner"></div>
  <div id="log">
    <div class="warn">Iniciando servidor en puerto <span id="portLabel">3000</span>...</div>
  </div>
  <button class="retry-btn" id="retryBtn" onclick="retry()">Reintentar</button>
</div>
<script>
var logEl = document.getElementById('log');
var spinner = document.querySelector('.spinner');
var retryBtn = document.getElementById('retryBtn');
var started = false;

function log(msg, cls) {
  var line = document.createElement('div');
  line.className = cls || '';
  line.textContent = new Date().toLocaleTimeString() + ' ' + msg;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
}

function retry() {
  retryBtn.classList.remove('show');
  spinner.style.display = 'block';
  log('Reintentando...', 'warn');
  window.electronAPI.restartServer();
}

// Listen for logs from main process
if (window.electronAPI && window.electronAPI.onServerLog) {
  window.electronAPI.onServerLog(function(msg) {
    if (started) return;
    var cls = msg.indexOf('[ERROR]') >= 0 || msg.indexOf('Error') >= 0 ? 'err' : '';
    log(msg.trim(), cls);
  });
}

// Listen for server ready from main process
if (window.electronAPI && window.electronAPI.onServerReady) {
  window.electronAPI.onServerReady(function() {
    started = true;
    log('Servidor listo. Redirigiendo...', 'ok');
  });
}

// Listen for server error
if (window.electronAPI && window.electronAPI.onServerError) {
  window.electronAPI.onServerError(function(msg) {
    spinner.style.display = 'none';
    log(msg, 'err');
    retryBtn.classList.add('show');
  });
}

// Parse port from URL
var params = new URLSearchParams(window.location.search);
var port = params.get('port') || '3000';
document.getElementById('portLabel').textContent = port;
</script>
</body>
</html>

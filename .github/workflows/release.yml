name: Build & Release POS System

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.1)'
        required: true
        default: 'v1.0.0'

jobs:
  build-and-release:
    name: Build Windows EXE + Create Release
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate icon files
        run: node scripts/create-icon.js

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_DISABLE_TYPE_CHECK: true
          AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'ci-build-secret-key' }}
          DATABASE_URL: 'file:./prisma/dev.db'
          AUTH_URL: 'http://localhost:3000'
          NEXT_PUBLIC_APP_URL: 'http://localhost:3000'

      - name: Clean Electron output
        shell: pwsh
        run: Remove-Item -Recurse -Force dist-electron -ErrorAction SilentlyContinue

      - name: Build Electron app (Windows)
        run: |
          echo "AUTH_SECRET=${{ secrets.AUTH_SECRET || 'pos-system-ci-secret-2026' }}" > .env
          echo "DATABASE_URL=file:./prisma/dev.db" >> .env
          echo "AUTH_URL=http://localhost:3000" >> .env
          echo "NEXT_PUBLIC_APP_URL=http://localhost:3000" >> .env
          npm run electron:build -- --publish never

      - name: List built artifacts
        run: Get-ChildItem -Recurse dist-electron/

      - name: Validate update metadata
        shell: pwsh
        run: |
          $references = Get-Content dist-electron/latest.yml | ForEach-Object {
            if ($_ -match '^\s*(?:url|path):\s*(.+?)\s*$') {
              [System.Uri]::UnescapeDataString($Matches[1].Trim())
            }
          } | Sort-Object -Unique

          if (-not $references) {
            throw 'latest.yml does not reference an update artifact.'
          }

          foreach ($reference in $references) {
            $artifact = Join-Path dist-electron $reference
            if (-not (Test-Path -LiteralPath $artifact -PathType Leaf)) {
              throw "latest.yml references a missing artifact: $reference"
            }
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: 'POS System ${{ github.event.inputs.version || github.ref_name }}'
          body: |
            ## POS System - Nueva version

            ### Instalacion
            1. Descarga `POS-System-Setup-<version>.exe`
            2. Ejecuta el instalador
            3. En la primera ejecucion, elige entre "Empezar en local" o "Punto de venta compartido"

            ### Modos de operacion
            - **Local (Servidor):** Este dispositivo ejecuta la BD y otros se conectan a el
            - **Compartido (Cliente):** Se conecta a un servidor existente en la red

            ---
            *Generado automaticamente por GitHub Actions*
          files: |
            dist-electron/*.exe
            dist-electron/*.blockmap
            dist-electron/latest.yml
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
